name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run quality gate
        run: ./gradlew clean check

      - name: Build and verify cross-platform JAR
        run: ./gradlew verifyUniversalJar

      - name: Smoke-test packaged JAR on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}
        run: xvfb-run -a java -jar "${{ github.workspace }}/build/libs/FocusFarm.jar" --smoke-test

      - name: Smoke-test packaged JAR on Windows and macOS
        if: runner.os != 'Linux'
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}
        run: java -jar "${{ github.workspace }}/build/libs/FocusFarm.jar" --smoke-test

      - name: Upload cross-platform JAR
        uses: actions/upload-artifact@v4
        with:
          name: FocusFarm-${{ runner.os }}-${{ runner.arch }}
          path: build/libs/FocusFarm.jar
