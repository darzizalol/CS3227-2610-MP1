plugins {
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'io.github.darzizalol'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25.0.4'
    modules = ['javafx.controls', 'javafx.swing']
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.github.darzizalol.focusfarm.Launcher'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(Javadoc).configureEach {
    options.addBooleanOption('Werror', true)
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = [
                'io.github.darzizalol.focusfarm.logic*',
                'io.github.darzizalol.focusfarm.model*',
                'io.github.darzizalol.focusfarm.storage*'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

checkstyle {
    toolVersion = '14.0.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
    dependsOn javadoc
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds a runnable JAR containing the current platform JavaFX runtime.'
    archiveFileName = 'FocusFarm.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
}

tasks.register('release', Copy) {
    group = 'distribution'
    description = 'Copies the runnable JAR into release/.'
    dependsOn tasks.named('fatJar')
    from tasks.named('fatJar').flatMap { it.archiveFile }
    into layout.projectDirectory.dir('release')
}

tasks.named('build') {
    dependsOn tasks.named('release')
}

tasks.register('snapshotUi', JavaExec) {
    group = 'verification'
    description = 'Renders a deterministic UI preview to build/visual/focus-farm.png.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.darzizalol.focusfarm.ui.UiSnapshotLauncher'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
